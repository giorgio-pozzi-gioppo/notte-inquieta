name: Mirror to Codeberg

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push mirror to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          git remote add codeberg https://Gioppo:${CODEBERG_TOKEN}@codeberg.org/Gioppo/notte-inquieta.git
          git push --force --prune codeberg refs/remotes/origin/*:refs/heads/*
          git push --force --prune codeberg --tags
